# /etc/sysctl.d/99-geogod-sysctl.conf に配置し sudo sysctl --system で適用
# 150接続規模ではほぼ予防的措置（接続数が増えたときの保険）

# accept キューの上限
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 1024

# FIN_WAIT の保持時間を短縮（再接続が多いWebSocket向け）
net.ipv4.tcp_fin_timeout = 15

# TIME_WAIT ソケットの再利用を許可
net.ipv4.tcp_tw_reuse = 1
