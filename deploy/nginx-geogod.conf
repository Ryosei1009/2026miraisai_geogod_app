# nginx リバースプロキシ設定
# 配置: /etc/nginx/sites-available/geogod → sites-enabled にシンボリックリンク
#
# 役割:
# - TLS終端（アプリ側は USE_HTTPS=false のままでよい。wss:// は nginx が受ける）
# - WebSocket / API のプロキシ
# - IPあたりの同時接続数制限
#
# クライアント(React)を Vercel など別ホストで配信している場合はこのままでよい。
# このサーバーから配信する場合は location / の try_files 案（下のコメント）を使う。
#
# your-domain.example.com と証明書パスは実環境に合わせて変更すること。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# IPあたりの同時接続数制限
# 会場Wi-Fi/キャリアNAT配下では多数の端末が同一IPになるため大きめに設定
limit_conn_zone $binary_remote_addr zone=geogod_conn:10m;

server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    limit_conn geogod_conn 300;

    # クライアントは wss://host/ （ルートパス）に接続するため、全パスをプロキシする
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocketを切らないために読み取りタイムアウトを長めに
        # （サーバー側ハートビートは30秒間隔なので120秒あれば十分）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 【静的ファイルもこのサーバーから配信する場合】
    # server/index.js の express.static のコメントアウトを解除した上で
    # 上記 location / のままでよい（nodeが配信）。
    # ※ アプリを /root/shino に置く構成では nginx(www-data) が /root を読めないため、
    #    nginx 直接配信を使う場合は dist を /var/www 等に置くこと:
    #
    # root /var/www/geogod/dist;
    # location / {
    #     error_page 418 = @backend;
    #     if ($http_upgrade = "websocket") { return 418; }
    #     try_files $uri $uri/ /index.html;
    # }
    # location /api/ { proxy_pass http://127.0.0.1:3001; }
    # location @backend {
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_set_header Origin $http_origin;
    #     proxy_read_timeout 120s;
    # }
}
